[tool.poetry]
name = "exam-server"
version = "0.2.0"
description = "Сервер экзаменационной системы"
authors = ["xoody44 <melnikov2007@list.ru>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.14"
fastapi = "^0.115"
uvicorn = { version = "^0.30", extras = ["standard"] }
gunicorn = "^22.0"
sqlalchemy = "^2.0"
alembic = "^1.13"
pydantic = "^2.8"
pydantic-settings = "^2.4"
python-multipart = "^0.0.9"
argon2-cffi = "^23.1"
psycopg2-binary = "^2.9"
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
aiosqlite = "^0.20"
pyjwt = "^2.15.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
httpx = "^0.27"
ruff = "^0.6"
black = "^26.5"
pyinstaller = {version = "^6.22.3", python = ">=3.14,<3.16"}

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]